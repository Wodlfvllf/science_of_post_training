# Generated task context is assisted; it is not a natural-error detection benchmark.
name: olmo3-repair-pilot
hypothesis: The base-to-posttraining repair gap narrows under an explicit check cue compared with a neutral continuation cue.
dataset: ../../data/posttrain/repair-pilot.jsonl
checkpoints:
  - name: base
    stage: base
    model_id: allenai/Olmo-3-1025-7B
    revision: main
  - name: sft
    stage: sft
    model_id: allenai/Olmo-3-7B-Think-SFT
    revision: main
  - name: dpo
    stage: dpo
    model_id: allenai/Olmo-3-7B-Think-DPO
    revision: main
  - name: rl
    stage: rl
    model_id: allenai/Olmo-3-7B-Think
    revision: main
prompts:
  - name: uncued
    format: completion
    cue: none
  - name: neutral
    format: completion
    cue: neutral
  - name: check
    format: completion
    cue: check
budgets: [256, 1024]
samples: 8
seed: 2026
generation:
  enabled: true
  max_new_tokens: 256
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: 0
  use_cache: true
inference:
  dtype: bfloat16
  attention: sdpa
  max_context_tokens: 16384